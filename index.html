<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammad Khizar – khizar@qau:~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e120d;--panel:#141a12;--fg:#d6e2c8;--dim:#7d8b72;--hi:#ffb454;--ok:#8fd16a;--err:#ff6b5e;--line:#26301f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-t="indigo"]{--bg:#0f1123;--panel:#161a33;--fg:#cfd6f6;--dim:#7882b0;--hi:#7aa2f7;--ok:#9ece6a;--err:#f7768e;--line:#262c52}
:root[data-t="green"]{--bg:#050b07;--panel:#0b1510;--fg:#c4f0cf;--dim:#5f8a6b;--hi:#39ff7a;--ok:#9dffb8;--err:#ff6b5e;--line:#143020}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 14px/1.55 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.win{max-width:960px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:12px}
.bar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-bottom:0;background:var(--panel);padding:8px 12px;border-radius:8px 8px 0 0;color:var(--dim);font-size:12px}
.bar b{color:var(--hi);font-weight:700}
.st{margin-left:auto}
.st.live{color:var(--ok)}
#term{flex:1;overflow-y:auto;border:1px solid var(--line);padding:14px;background:var(--bg);overscroll-behavior:contain}
.ln{white-space:pre-wrap;word-break:break-word;margin:0}
.hi{color:var(--hi)}.ok{color:var(--ok)}.err{color:var(--err)}.dim{color:var(--dim)}.b{font-weight:700}
a{color:var(--hi)}
.art{color:var(--hi);line-height:1.15;font-size:clamp(7px,2.1vw,14px);white-space:pre;margin:0 0 6px}
.row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-top:0;background:var(--panel);padding:8px 12px}
.row label{color:var(--ok);white-space:nowrap}
#in{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;caret-color:var(--hi)}
#in:focus{outline:none}
.row:focus-within{border-color:var(--hi)}
.chips{display:flex;gap:6px;flex-wrap:wrap;border:1px solid var(--line);border-top:0;background:var(--panel);padding:0 12px 10px;border-radius:0 0 8px 8px}
.chips button{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--hi);color:var(--hi);outline:none}
canvas{display:block;border:1px solid var(--hi);background:#0a0d09;max-width:100%;margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;margin:4px 0 8px}
.pad button{height:36px;font:inherit;color:var(--hi);background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}
.glitch{animation:gl .5s steps(2) 6}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-3px,1px);filter:hue-rotate(90deg)}50%{transform:translate(3px,-1px)}100%{transform:translate(0)}}
@media (prefers-reduced-motion:reduce){.glitch{animation:none}}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="bar"><b>khizar@qau</b><span>~/profile</span><span class="st" id="st">api: connecting</span></div>
  <div id="term" role="log" aria-live="polite" tabindex="-1"></div>
  <div class="row"><label for="in">$</label><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command" placeholder="type help"></div>
  <div class="chips" id="chips"></div>
</div>
<script>
(function(){
var USER='mkhizar06';
var DATA={
 name:'Mohammad Khizar',tag:'Compile your dreams into reality!',
 uni:'Quaid-i-Azam University, Islamabad',year:'3rd year, Computer Science',
 focus:'Systems programming, low-level engineering, applied CS',
 linkedin:'https://www.linkedin.com/in/mohammad-khizar/',
 langs:['C','C++','C#','Python','JavaScript','SQL','HTML5','CSS3'],
 tools:['Git','GitHub','VS Code','Visual Studio','MySQL','Linux'],
 courses:['Data Structures','Databases','Applied ML'],
 repos:[
  {name:'WeatherDataAnalysis-cpp',description:'Weather data analysis in C++.',language:'C++'},
  {name:'VehicleRentalSystem-cpp',description:'Vehicle rental management in C++.',language:'C++'},
  {name:'InventoryManagementSystem-cpp',description:'Inventory management in C++.',language:'C++'},
  {name:'MatrixCalculator-cpp',description:'Matrix operations calculator in C++.',language:'C++'},
  {name:'cpp-programs',description:'Collection of C++ practice programs.',language:'C++'},
  {name:'-Gary_J._Bronson-_A_First_Book_of_Cpp-Solutions',description:'Solutions to A First Book of C++.',language:'C++'}
 ],
 stats:{public_repos:13,followers:3,following:4}
};
var live=null,term=document.getElementById('term'),inp=document.getElementById('in');
var head=document.createElement('div'),out=document.createElement('div'),cur=head;
out.style.marginTop='14px';term.appendChild(head);term.appendChild(out);

function line(t,c){var d=document.createElement('div');d.className='ln'+(c?' '+c:'');d.textContent=t;cur.appendChild(d);return d}
function scroll(){}
function link(label,url){var d=document.createElement('div');d.className='ln';var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=label;d.appendChild(a);cur.appendChild(d)}
function art(t){var p=document.createElement('pre');p.className='art';p.textContent=t;cur.appendChild(p)}
function kv(k,v){var d=document.createElement('div');d.className='ln';var s=document.createElement('span');s.className='hi';s.textContent=(k+'            ').slice(0,12);d.appendChild(s);d.appendChild(document.createTextNode(v));cur.appendChild(d)}
function repoList(){return live&&live.repos&&live.repos.length?live.repos:DATA.repos}
function stats(){return live?live.user:DATA.stats}

var L={
'M':String.raw` __  __ ~|  \/  |~| |\/| |~|_|  |_|~`,
'.':String.raw`   ~   ~ _ ~(_)~`,
' ':String.raw`  ~  ~  ~  ~`,
'K':String.raw` _  __~| |/ /~| ' < ~|_|\_\~`,
'H':String.raw` _  _ ~| || |~| __ |~|_||_|~`,
'I':String.raw` ___ ~|_ _|~ | | ~|___|~`,
'Z':String.raw` ____~|_  /~ / / ~/___|~`,
'A':String.raw`   _   ~  /_\  ~ / _ \ ~/_/ \_\~`,
'R':String.raw` ___ ~| _ \~|   /~|_|_\~`
};
var ART=[0,1,2,3].map(function(r){return 'M. KHIZAR'.split('').map(function(c){return L[c].split('~')[r]}).join('')}).join('\n');

var C={
 help:function(){
  line('Commands:','hi b');
  [['about','who I am'],['projects','my repositories'],['skills','languages and tools'],['stats','GitHub numbers'],['connect','find me online'],['snake','play a game'],['neofetch','system info'],['theme','amber | indigo | green'],['clear','wipe the screen']].forEach(function(r){kv(r[0],r[1])});
  line('Some commands are not listed. Try poking around.','dim');
 },
 about:function(){
  line(DATA.name,'hi b');line(DATA.tag,'dim');line('');
  kv('university',DATA.uni);kv('year',DATA.year);kv('focus',DATA.focus);kv('approach','Learn deeply, build deliberately, iterate fast');
  line('');line('I learn by building: working through problems hands-on rather than only studying theory.');
 },
 projects:function(){
  var r=repoList();line('Repositories ('+r.length+(live?', live from GitHub':', saved copy')+'):','hi b');
  r.forEach(function(x,i){
   line((i+1)+'. '+x.name+'  ['+(x.language||'n/a')+']','ok');
   if(x.description)line('   '+x.description,'dim');
  });
  line('');line('Type "open <number>" to open a repo.','dim');
 },
 open:function(a){
  var r=repoList(),i=parseInt(a[0],10)-1;
  if(!r[i]){line('usage: open <number from projects>','err');return}
  link('https://github.com/'+USER+'/'+r[i].name,'https://github.com/'+USER+'/'+r[i].name);
 },
 skills:function(){
  kv('languages',DATA.langs.join(', '));kv('tools',DATA.tools.join(', '));kv('coursework',DATA.courses.join(', '));
 },
 stats:function(){
  var s=stats();kv('repos',String(s.public_repos));kv('followers',String(s.followers));kv('following',String(s.following));
  if(live&&live.repos){
   var m={};live.repos.forEach(function(r){if(r.language)m[r.language]=(m[r.language]||0)+1});
   var t=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
   if(t.length){line('');line('Top languages','hi b');t.slice(0,5).forEach(function(l){line((l+'          ').slice(0,10)+'#'.repeat(Math.max(1,Math.round(m[l]/live.repos.length*30)))+' '+m[l])})}
  }else line('Live data is off in this view. It loads when hosted on GitHub Pages.','dim');
 },
 connect:function(){
  link('GitHub: github.com/'+USER,'https://github.com/'+USER);
  link('LinkedIn: in/mohammad-khizar',DATA.linkedin);
 },
 neofetch:function(){
  art(ART);
  kv('user',USER+'@github');kv('os','QAU CS, year 3');kv('shell','C++ / systems');kv('uptime','building since day 1');kv('repos',String(stats().public_repos));
 },
 theme:function(a){
  var t=(a[0]||'').toLowerCase();
  if(['amber','indigo','green'].indexOf(t)<0){line('usage: theme amber | indigo | green','err');return}
  if(t==='amber')document.documentElement.removeAttribute('data-t');else document.documentElement.dataset.t=t;
  line('theme set to '+t,'ok');
 },
 clear:function(){out.innerHTML=''},
 ls:function(){line('about  projects  skills  stats  connect  secret.txt','ok')},
 cat:function(a){
  if(a[0]==='secret.txt'){line('You found it. Real programmers read the filesystem.','hi');line('Hint: the Konami code does something here.','dim')}
  else if(!a[0])line('usage: cat <file>','err');
  else line('cat: '+a[0]+': No such file','err');
 },
 whoami:function(){C.about()},
 sudo:function(){line('khizar is not in the sudoers file. This incident will be reported.','err')},
 rm:function(){line('Nice try. Deleting production is not on today’s roadmap.','err')},
 vim:function(){line('You are now trapped in vim. Type :q! to leave. (Just kidding. Nothing happened.)','dim')},
 exit:function(){line('There is no escape. Type "help".','dim')},
 coffee:function(){line('  ( (\n   ) )\n  .______.\n  |      |]\n  \\      /\n   `----\'','hi');line('Brewing... segfault avoided.','dim')},
 hack:function(){
  var w=document.getElementById('win');w.classList.add('glitch');
  ['Bypassing firewall...','Injecting payload...','Access granted.'].forEach(function(m,i){setTimeout(function(){line(m,i===2?'ok':'dim')},i*500)});
  setTimeout(function(){w.classList.remove('glitch');line('Just kidding. This is a portfolio.','dim')},1900);
 },
 quote:function(){line('"If debugging is the process of removing software bugs, then programming must be the process of putting them in." Edsger W. Dijkstra','dim')},
 '42':function(){line('The answer to life, the universe and everything. Also a fine array index.','hi')},
 snake:function(){startSnake()}
};
C.project=C.projects;C.ls=C.ls;C.game=C.snake;C.whois=C.about;

/* Snake */
var game=null;
function startSnake(){
  if(game)return;
  var W=20,H=14,S=16,cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;cv.setAttribute('aria-label','Snake game');
  var x=cv.getContext('2d');
  var sn=[{x:5,y:7},{x:4,y:7},{x:3,y:7}],dir={x:1,y:0},nd={x:1,y:0},food=null,score=0,over=false;
  var info=line('Snake: arrows/WASD or the pad. Eat the bugs. q quits.','dim'),sc=line('score: 0','hi');
  cur.appendChild(cv);
  var pad=document.createElement('div');pad.className='pad';
  [['▲',0,-1],['◀',-1,0],['▼',0,1],['▶',1,0]].forEach(function(p){var b=document.createElement('button');b.type='button';b.textContent=p[0];b.setAttribute('aria-label','Move '+p[0]);b.onclick=function(){turn(p[1],p[2])};pad.appendChild(b)});
  cur.appendChild(pad);
  function turn(a,b){if(a===-dir.x&&b===-dir.y)return;nd={x:a,y:b}}
  function place(){do{food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}while(sn.some(function(s){return s.x===food.x&&s.y===food.y}))}
  place();
  function draw(){
    var cs=getComputedStyle(document.documentElement),hi=cs.getPropertyValue('--hi'),ok=cs.getPropertyValue('--ok');
    x.fillStyle='#0a0d09';x.fillRect(0,0,cv.width,cv.height);
    x.fillStyle=ok;sn.forEach(function(s,i){x.globalAlpha=i?0.75:1;x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});x.globalAlpha=1;
    x.fillStyle=hi;x.font='bold '+(S-2)+'px monospace';x.textBaseline='top';x.fillText('#',food.x*S+3,food.y*S+1);
  }
  function tick(){
    dir=nd;var h={x:(sn[0].x+dir.x+W)%W,y:(sn[0].y+dir.y+H)%H};
    if(sn.some(function(s){return s.x===h.x&&s.y===h.y})){end('Segmentation fault. Final score: '+score);return}
    sn.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;sc.textContent='score: '+score;place();if(score===10)easter('Ten bugs squashed. You are hired.')}else sn.pop();
    draw();
  }
  function key(e){
    var m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]},k=m[e.key];
    if(k){e.preventDefault();e.stopPropagation();turn(k[0],k[1])}
    else if(e.key==='q'||e.key==='Escape'){e.preventDefault();end('Game closed. Score: '+score)}
  }
  function end(msg){clearInterval(game.t);window.removeEventListener('keydown',key,true);pad.remove();line(msg,over?'':'err');game=null;inp.focus()}
  window.addEventListener('keydown',key,true);
  game={t:setInterval(tick,115),end:end};draw();
}
function easter(m){line(m,'ok')}

/* Input */
var hist=[],hi=0;
function run(raw){
  var t=raw.trim();if(!t)return;
  if(game)game.end('');
  out.innerHTML='';term.scrollTop=0;
  var d=document.createElement('div');d.className='ln';
  d.innerHTML='<span class="ok">$</span> ';d.appendChild(document.createTextNode(t));cur.appendChild(d);
  hist.push(t);hi=hist.length;
  var p=t.split(/\s+/),c=p[0].toLowerCase();
  if(c==='sudo'||c==='rm'){C[c]();return}
  if(Object.prototype.hasOwnProperty.call(C,c))C[c](p.slice(1));
  else line('command not found: '+c+'. Type "help".','err');
  scroll();
}
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'){var v=inp.value;inp.value='';run(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){hi--;inp.value=hist[hi]}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}}
  else if(e.key==='Tab'){
    e.preventDefault();var v=inp.value.toLowerCase();if(!v)return;
    var m=Object.keys(C).filter(function(k){return k.indexOf(v)===0});if(m.length===1)inp.value=m[0];
  }
});
term.addEventListener('click',function(e){if(!window.getSelection().toString()&&e.target.tagName!=='A')inp.focus()});

/* Chips */
var chips=document.getElementById('chips');
['help','about','projects','skills','stats','connect','snake','neofetch'].forEach(function(c){
  var b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=function(){run(c)};chips.appendChild(b);
});

/* Konami */
var K=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'],ki=0;
window.addEventListener('keydown',function(e){
  if(game)return;
  ki=(e.key===K[ki])?ki+1:(e.key===K[0]?1:0);
  if(ki===K.length){ki=0;document.documentElement.dataset.t='green';line('+30 lives. Cheat mode on: theme switched to green.','hi')}
});

/* Live GitHub data (works when hosted on GitHub Pages) */
var st=document.getElementById('st');
function setApi(ok){st.textContent=ok?'api: live':'api: offline, saved copy';st.className='st'+(ok?' live':'')}
(function(){
  try{
    Promise.all([
      fetch('https://api.github.com/users/'+USER).then(function(r){if(!r.ok)throw 0;return r.json()}),
      fetch('https://api.github.com/users/'+USER+'/repos?per_page=100&sort=updated').then(function(r){if(!r.ok)throw 0;return r.json()})
    ]).then(function(a){
      live={user:a[0],repos:a[1].filter(function(r){return !r.fork})};setApi(true);
    }).catch(function(){setApi(false)});
  }catch(e){setApi(false)}
})();

/* Boot */
var boot=[
 ['art'],['Welcome to Mohammad Khizar’s profile terminal.','hi b'],[DATA.tag,'dim'],['Type "help", or tap a command below. Tab completes. Up arrow recalls.','dim'],['']
];
boot.forEach(function(b){if(b[0]==='art')art(ART);else line(b[0],b[1])});cur=out;
inp.focus();
})();
</script>
</body>
</html>
